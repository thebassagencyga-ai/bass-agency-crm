name: CI

# Runs on every push to any branch (private repo; one owner), so phase branches are
# verified before review. Pull requests from this repo are covered by the push runs.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, unit tests, builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the secret scan
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Secret scan (tracked files and full Git history)
        run: node scripts/secret-scan.mjs
      - name: Dependency audit (production dependencies, high or critical fails)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser bundle contains no secrets or Supabase config
        run: node scripts/check-client-bundle.mjs
      - name: Cloudflare Workers build (OpenNext)
        run: npx opennextjs-cloudflare build
      - name: Worker bundle size (dry run, nothing is deployed)
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

  database:
    name: Schema and RLS tests (PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Backup/restore rehearsals (tests/db/backup-*.test.ts) need client tools that
      # match the server version.
      PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
      PG_RESTORE: /usr/lib/postgresql/17/bin/pg_restore
      PSQL: /usr/lib/postgresql/17/bin/psql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: PostgreSQL 17 client tools (official PostgreSQL apt repository)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - run: npm ci
      - run: npm run test:db

  supabase:
    name: Migrations on Supabase Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Start local Supabase database and apply migrations
        run: npx supabase db start
      - name: Lint database functions
        run: npx supabase db lint --local --fail-on error
      - name: RLS smoke test with Supabase's real auth schema
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/db/supabase-smoke.sql
      - if: always()
        run: npx supabase stop --no-backup

  integration:
    name: Sign-in and security (real Supabase stack, Cloudflare build, browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Start local Supabase (database, auth, data API, email catcher)
        run: npx supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,postgres-meta,supavisor

      - name: Export the local stack's URL and keys (throwaway, local only)
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY"
            echo "APP_URL=http://127.0.0.1:8787"
          } >> "$GITHUB_ENV"
          # Phase 26: a throwaway alert key for this run only (production keys never pass through CI).
          PUSH_KEY=$(node scripts/make-test-push-key.mjs)
          echo "::add-mask::$PUSH_KEY"
          echo "PUSH_KEY=$PUSH_KEY" >> "$GITHUB_ENV"

      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build

      - name: Browser bundle contains no keys, secrets or Supabase URL
        run: FORBIDDEN_VALUES="$SUPABASE_SECRET_KEY,$SUPABASE_PUBLISHABLE_KEY,$SUPABASE_URL,$PUSH_KEY" node scripts/check-client-bundle.mjs

      - name: Start the app in workerd
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\nSITE_URL=%s\nINSECURE_COOKIES_FOR_LOCAL_TESTS=1\nPUSH_KEY=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" "$APP_URL" "$PUSH_KEY" > .dev.vars
          nohup npx wrangler dev --port 8787 --ip 127.0.0.1 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null "$APP_URL/login" && exit 0; sleep 2; done
          tail -50 "$RUNNER_TEMP/wrangler.log"; exit 1

      - name: Production smoke test script against the Cloudflare build
        run: bash scripts/smoke-test.sh "$APP_URL"

      - name: Auth API and app HTTP tests
        run: npm run test:integration

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser journey (sign in, two-step setup, sign out, sign in with code)
        run: npm run test:e2e

      - name: App log on failure
        if: failure()
        run: |
          tail -100 "$RUNNER_TEMP/wrangler.log" || true
          # Page snapshot at the failing step (fictional test data only).
          find test-results -name error-context.md -exec cat {} \; 2>/dev/null || true

      - name: Keep Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - if: always()
        run: npx supabase stop --no-backup
