name: Backup restore drill

# Proves the latest backup can be restored (Phase 12, ADR-026/027). Started by hand, from main;
# run it monthly. Never touches the production project. Steps:
#   1. Download the latest (or a chosen) "Nightly backup" and decrypt it.
#   2. Build a throwaway Supabase database on this runner from the migrations in Git, and
#      re-create the backed-up sign-ins there with NEW ids (as after a real disaster).
#   3. Restore with the same scripts as "Restore backup", then check: same row count in every
#      table, every row has its owner, and the deploy's security verification passes.
#   4. Delete everything. Logs show counts only.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of the Nightly backup to use, from its address …/actions/runs/<ID> (empty = latest)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  drill:
    name: Restore the backup into a throwaway local database
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      GH_TOKEN: ${{ github.token }}
      RESTORE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Working folder on this runner (deleted at the end)
        run: echo "WORK=$RUNNER_TEMP/restore-drill" >> "$GITHUB_ENV"

      - name: Download and decrypt the backup
        run: bash scripts/fetch-backup.sh "$RUN_ID" "$WORK"

      - name: Build a throwaway local database from the migrations in Git
        run: npx supabase db start

      - name: Re-create the sign-ins (new ids), check the target, remap the copy
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/backup-tool.mts seed-users "$WORK"
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/backup-tool.mts prepare "$WORK" local

      - name: Restore (one transaction)
        run: bash scripts/restore-load.sh "$RESTORE_DATABASE_URL" "$WORK"

      - name: Check the restored copy
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/backup-tool.mts check "$WORK" local

      - name: Done
        run: echo "✓ Restore drill passed."

      - name: Delete the copy and the throwaway database
        if: always()
        run: |
          rm -rf "$WORK"
          npx supabase stop --no-backup || true
