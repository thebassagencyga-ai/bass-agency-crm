name: Restore backup (into an empty CRM project)

# Disaster recovery on Supabase Free (ADR-027, docs/runbook.md §4). Started by hand, from main.
# It ONLY restores into a project with the CRM schema and NO client records (contacts,
# opportunities, tasks, activities, renewal outcomes, cross-sell dismissals) — for example a
# brand-new project after the old one was lost. It refuses anything else, so it cannot
# overwrite live work. Before running:
#   1. Supabase: the project exists; its sign-ins are re-created (Authentication → Users → Add
#      user, same emails as before); the secrets SUPABASE_PROJECT_REF / SUPABASE_DB_PASSWORD
#      point at it.
#   2. Actions → Deploy database migrations (Apply) has run on it.
# Steps: download + decrypt the backup, check the target, then empty the CRM tables and load the
# copy in ONE transaction (sign-in ids remapped by email), then check counts, owners, security.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESTORE to confirm'
        required: true
      run_id:
        description: "Run ID of the Nightly backup to restore, from its address …/actions/runs/<ID> (empty = latest)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  restore:
    name: Restore the backup into the CRM project
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      GH_TOKEN: ${{ github.token }}
      CONFIRM: ${{ inputs.confirm }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Confirmation
        run: |
          if [ "$CONFIRM" != "RESTORE" ]; then echo "✗ Type RESTORE in the confirm box to run this."; exit 1; fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Working folder on this runner (deleted at the end)
        run: echo "WORK=$RUNNER_TEMP/restore" >> "$GITHUB_ENV"

      - name: Check the four secrets are set
        run: |
          missing=0
          for name in SUPABASE_PROJECT_REF SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD BACKUP_PASSPHRASE; do
            if [ -z "${!name}" ]; then echo "✗ Secret $name is not set"; missing=1; fi
          done
          exit $missing

      - name: Confirm the target is the CRM project (read-only)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/supabase-remote.mts guard

      - name: Download and decrypt the backup
        run: bash scripts/fetch-backup.sh "$RUN_ID" "$WORK"

      - name: Check the target (schema current, no client records, same sign-ins) and remap the copy
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/backup-tool.mts prepare "$WORK" remote

      - name: Link the project (gives the database address; the password stays in the secret)
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Restore (one transaction)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          url="$(cat supabase/.temp/pooler-url 2>/dev/null || true)"
          if [ -z "$url" ]; then echo "✗ supabase link did not record the database address."; exit 1; fi
          bash scripts/restore-load.sh "$url" "$WORK"

      - name: Check the restored project
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/backup-tool.mts check "$WORK" remote

      - name: Delete the working folder
        if: always()
        run: rm -rf "$WORK"
