<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offline · ZeroLapse CRM</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fff; color: #0f172a; }
  main { max-width: 26rem; padding: 1.5rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .75rem; }
  p { line-height: 1.5; margin: 0 0 1rem; }
  a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 1rem; border-radius: .375rem;
      background: #0f172a; color: #fff; font-weight: 600; text-decoration: none; }
  a:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
  @media (prefers-color-scheme: dark) {
    body { background: #020617; color: #f1f5f9; }
    a { background: #f1f5f9; color: #0f172a; }
  }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>ZeroLapse CRM needs an internet connection to show your contacts, tasks and pipeline. Nothing about your clients is stored on this phone.</p>
  <p>Check your signal or Wi-Fi, then try again.</p>
  <a href="/dashboard">Try again</a>
</main>
</body>
</html>
